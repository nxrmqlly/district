{{ define "header" }}

<header>

    </a>
    <nav class="top-nav">
        <div class="links">
            <a href="/">home</a> | <a href="/submit">write</a>
        </div>

            <a href="/login">login</a>

<style>
    header {
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
    }

    .top-nav {
        font-size: 1.2em;
        background-color: var(--surface);
        width: 100%;
        display: flex;
        justify-content: space-between;
    }

    .top-nav a {
        color: var(--text);
    }

    .top-nav a:visited {
        color: var(--text);
    }

    .header-site-title {
        text-decoration: none;

        & > h1 {
            text-decoration: none;
            color: var(--accent);
            font-weight: 400;
            font-size: 2rem;
