version: "2"
sql:
    - engine: "postgresql"
      queries: "store/queries"
      schema: "store/migrations"
      gen:
          go:
              package: "store"
              sql_package: "pgx/v5"
              out: "store"

              emit_pointers_for_null_types: true

              overrides:
                  - db_type: "uuid"
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"

                  - db_type: "timestamptz"
                    nullable: true
                    go_type:
                        import: "time"
                        type: "Time"
                        pointer: true

                  - db_type: "timestamptz"
                    nullable: false
                    go_type:
                        import: "time"
                        type: "Time"
